<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Driver Telemetry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>ESP32 Driver Telemetry: Visualization</h1>
            <div class="status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </header>

        <p class="last-update">
            Last Updated: <span id="update-time">Loading...</span>
        </p>

    
        <section class="sensor-grid">
            <div class="card">
                <h2>Ambient</h2>
                <p id="temp-val">--</p>
            </div>
            <div class="card">
                <h2>RH (%)</h2>
                <p id="hum-val">-- %</p>
            </div>
            <div class="card">
                <h2>Barometric (hPa)</h2>
                <p id="pres-val">--</p>
            </div>
        </section>

    
        <section class="history">
            <div class="history-header">
                <h2>History</h2>
                <div class="time-buttons">
                    <button data-range="1h">1h</button>
                    <button data-range="3h">3h</button>
                    <button data-range="6h">6h</button>
                    <button data-range="12h">12h</button>
                    <button data-range="24h" class="active">24h</button>
                </div>
            </div>

            <div class="charts-container">
                <div class="chart-card">
                    <h3>Ambient History </h3>
                    <div class="canvas-wrapper">
                        <canvas id="tempChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h3>RH History </h3>
                    <div class="canvas-wrapper">
                        <canvas id="humChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h3>Barometric History </h3>
                    <div class="canvas-wrapper">
                        <canvas id="presChart"></canvas>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
