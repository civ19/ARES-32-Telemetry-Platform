services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_password
      POSTGRES_DB: telemetry_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ares-network


  app:
    build: ./backend/telemetry-api
    ports:
      - "8080:8080"
    environment:
      # This matches the names we gave to the 'db' service above
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/telemetry_db
      SPRING_DATASOURCE_USERNAME: telemetry_user
      SPRING_DATASOURCE_PASSWORD: telemetry_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db
    networks:
      - ares-network